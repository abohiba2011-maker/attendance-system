<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 التحقق الثانوي - صيدلية المقري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #4c1d95, #0f172a);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-white">

    <div class="w-full max-w-md">
        <div class="bg-slate-900/90 backdrop-blur-xl border border-purple-700/60 shadow-2xl rounded-3xl p-8 space-y-6">

            <div class="text-center space-y-2">
                <div class="w-20 h-20 mx-auto rounded-2xl bg-purple-600 flex items-center justify-center text-4xl shadow-lg shadow-purple-500/50">
                    🔐
                </div>
                <h1 class="text-2xl font-black text-white">التحقق الثانوي</h1>
                <p class="text-sm text-purple-300">كلمة السر الثانية مطلوبة</p>
            </div>

            {% if error %}
            <div class="bg-rose-600/20 border border-rose-500/50 text-rose-300 px-4 py-3 rounded-xl text-center text-sm font-bold">
                {{ error }}
            </div>
            {% endif %}

            <div class="bg-purple-900/30 border border-purple-700 rounded-2xl p-4">
                <p class="text-xs text-purple-100 text-center">
                    🛡️ <strong>حماية إضافية:</strong><br>
                    حتى لو عرف أحد كلمة مرور الدخول، لن يستطيع فتح اللوحة بدون هذه الكلمة
                </p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-2 font-bold">
                        🔑 كلمة السر الثانوية
                    </label>
                    <input type="password" name="password_2fa" required autofocus
                           class="w-full bg-slate-950 border-2 border-purple-700 focus:border-purple-500 rounded-xl px-4 py-4 text-center text-lg text-white outline-none transition"
                           placeholder="••••••••"
                           autocomplete="off">
                </div>

                <button type="submit"
                        class="w-full bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-500 hover:to-violet-500 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg">
                    🔓 فتح اللوحة
                </button>
            </form>

            <div class="text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
                <a href="/logout" class="text-rose-400 hover:underline">🚪 خروج</a>
            </div>

        </div>
    </div>

</body>
</html>
