<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الحركة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background: #0f172a; min-height: 100vh; }</style>
</head>
<body class="text-slate-100">

    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl">✏️</div>
                <div>
                    <h1 class="text-xl font-bold text-white">تعديل الحركة</h1>
                    <p class="text-xs text-blue-400">رقم {{ record.id }}</p>
                </div>
            </div>
            <a href="/admin/manage_attendance" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold border border-slate-700">
                ← العودة
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 md:p-6">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow">
            
            <!-- Info Card -->
            <div class="bg-blue-900/30 border border-blue-700 rounded-2xl p-4 mb-6">
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div>
                        <p class="text-xs text-slate-400">الموظف:</p>
                        <p class="font-bold">{{ record.first_name }} {{ record.last_name or '' }}</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">الكود:</p>
                        <p class="font-mono font-bold text-blue-400">{{ record.emp_code }}</p>
                    </div>
                </div>
            </div>

            <!-- Edit Form -->
            <form method="POST" class="space-y-4">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">التاريخ</label>
                        <input type="date" name="date" value="{{ record.date }}" required
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">نوع الحدث</label>
                        <select name="event_type" required
                                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                            <option value="in" {% if record.event_type == 'in' %}selected{% endif %}>📥 حضور</option>
                            <option value="out" {% if record.event_type == 'out' %}selected{% endif %}>📤 انصراف نهائي</option>
                            <option value="leave" {% if record.event_type == 'leave' %}selected{% endif %}>🚪 انصراف بسبب</option>
                            <option value="return" {% if record.event_type == 'return' %}selected{% endif %}>🔄 عودة</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">وقت الدخول (HH:MM:SS)</label>
                        <input type="text" name="check_in" value="{{ record.check_in or '' }}"
                               placeholder="08:00:00"
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm font-mono">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">وقت الانصراف (HH:MM:SS)</label>
                        <input type="text" name="check_out" value="{{ record.check_out or '' }}"
                               placeholder="16:00:00"
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">دقائق التأخير</label>
                        <input type="number" name="late_minutes" value="{{ record.late_minutes or 0 }}"
                               min="0"
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">مدة الانصراف (دقيقة)</label>
                        <input type="number" name="duration_min" value="{{ record.duration_min or 0 }}"
                               min="0"
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">سبب الانصراف (إن كان انصراف بسبب)</label>
                    <select name="leave_reason_id"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                        <option value="">— بدون —</option>
                        {% for r in reasons %}
                        <option value="{{ r.id }}" {% if record.leave_reason_id == r.id %}selected{% endif %}>
                            {{ r.icon }} {{ r.reason_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">ملاحظات</label>
                    <textarea name="notes" rows="3"
                              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm"
                              placeholder="ملاحظات إضافية...">{{ record.notes or '' }}</textarea>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-4">
                    <button type="submit"
                            class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">
                        💾 حفظ التعديلات
                    </button>
                    <a href="/admin/manage_attendance"
                       class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition text-center">
                        ✖ إلغاء
                    </a>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
