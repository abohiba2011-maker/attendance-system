<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة التسجيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; min-height: 100vh; }
        {% if success %}body { background: linear-gradient(135deg, #059669, #047857); }
        {% else %}body { background: linear-gradient(135deg, #e11d48, #9f1239); }{% endif %}
    </style>
</head>
<body class="flex items-center justify-center p-4 text-white">

    <div class="max-w-md w-full text-center">
        {% if success %}
        <div class="text-9xl mb-4">✅</div>
        <h1 class="text-4xl font-black mb-3">تم التسجيل!</h1>
        {% else %}
        <div class="text-9xl mb-4">❌</div>
        <h1 class="text-4xl font-black mb-3">لم يتم التسجيل</h1>
        {% endif %}

        <p class="text-lg opacity-95 mb-6">{{ message }}</p>

        <div class="bg-white/20 backdrop-blur rounded-2xl p-4 mb-6">
            <div class="text-sm opacity-75 mb-1">الكود</div>
            <div class="text-3xl font-mono font-bold">{{ emp_code }}</div>
        </div>

        {% if token %}
        <a href="/scan/{{ token }}"
           class="inline-block bg-white/30 hover:bg-white/40 text-white font-bold py-3 px-6 rounded-xl backdrop-blur">
            🔄 مرة أخرى
        </a>
        {% endif %}

        <div class="mt-8 text-sm opacity-60">
            🏥 صيدلية المقري شنن عثمان
        </div>
    </div>

</body>
</html>
