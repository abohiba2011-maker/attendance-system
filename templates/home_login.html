<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 صفحة محمية - صيدلية المقري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-white">

    <div class="w-full max-w-md">
        <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-700/60 shadow-2xl rounded-3xl p-8 space-y-6">

            <div class="text-center space-y-2">
                <div class="w-20 h-20 mx-auto rounded-2xl bg-blue-600 flex items-center justify-center text-4xl shadow-lg shadow-blue-500/50">
                    🔐
                </div>
                <h1 class="text-2xl font-black text-white">صفحة محمية</h1>
                <p class="text-sm text-slate-400">هذه الصفحة للأدمن فقط</p>
            </div>

            {% if error %}
            <div class="bg-rose-600/20 border border-rose-500/50 text-rose-300 px-4 py-3 rounded-xl text-center text-sm font-bold">
                {{ error }}
            </div>
            {% endif %}

            <div class="bg-blue-900/30 border border-blue-700 rounded-2xl p-4">
                <p class="text-xs text-blue-200 text-center leading-relaxed">
                    💡 <strong>للموظفين:</strong><br>
                    استخدموا <strong>رابطكم الشخصي</strong> من هاتفكم
                </p>
                {% if client_ip %}
                <div class="mt-3 pt-3 border-t border-blue-700">
                    <p class="text-xs text-blue-300 text-center">
                        جهازك: <span class="font-mono text-blue-100">{{ client_ip }}</span>
                    </p>
                </div>
                {% endif %}
            </div>

            <form method="POST" action="/" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-2 font-bold">
                        🔑 كلمة مرور الأدمن
                    </label>
                    <input type="password" name="password" required autofocus
                           class="w-full bg-slate-950 border-2 border-slate-700 focus:border-blue-500 rounded-xl px-4 py-4 text-center text-lg text-white outline-none transition"
                           placeholder="••••••••"
                           autocomplete="current-password">
                </div>

                <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg">
                    🔓 فتح الصفحة
                </button>
            </form>

            <div class="text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
                <p>🏥 صيدلية المقري شنن عثمان</p>
                <p class="mt-1 text-slate-600">الجلسة تبقى مفتوحة ساعة واحدة</p>
            </div>

        </div>
    </div>

</body>
</html>
